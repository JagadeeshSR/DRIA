version: "3.8"
services:
  node-backend:
    build: ./backend-node
    container_name: dria-node-backend
    ports:
      - "3000:3000"
    restart: unless-stopped

  python-backend:
    build: ./backend-python
    container_name: dria-python-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: dria-frontend
    ports:
      - "8080:80"
    depends_on:
      - node-backend
      - python-backend
    restart: unless-stopped
